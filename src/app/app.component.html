<main class="shell">
  <header class="hero">
    <div class="eyebrow">City Explorer</div>
    <h1>Une ville, plusieurs flux.</h1>
    <p class="intro">
      Recherche une ville et consulte sa météo, sa qualité de l’air et les
      informations de son pays.
    </p>
    <app-search-bar (searchRequested)="facade.search($event)" />
  </header>
  <app-city-dashboard
    [viewModel]="facade.viewModel()"
    [status]="facade.status()"
  />
  <footer>
    <span>Angular 22 · RxJS 7.8</span
    ><span>Open-Meteo · API gratuite sans clé</span>
  </footer>
</main>
